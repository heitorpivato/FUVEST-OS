<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FUVEST OS">
<title>FUVEST OS — Agenda v10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* === TEMA DIA (PADRÃO CLARO) === */
:root{
  --accent:#3054D0;
  --accent-fill:rgba(48,84,208,.10);
  --accent-border:rgba(48,84,208,.24);
  --bg:#EFF2FB;
  --panel:#FFFFFF;
  --panel-2:#E4E9F7;
  --ink:#111827;
  --ink-2:rgba(17,24,39,.58);
  --ink-3:rgba(17,24,39,.34);
  --ink-4:rgba(17,24,39,.17);
  --muted:#6B748A;
  --fill-1:rgba(48,84,208,.08);
  --fill-2:rgba(17,30,80,.07);
  --fill-3:rgba(17,30,80,.045);
  --fill-4:rgba(17,30,80,.025);
  --line:rgba(15,28,80,.09);
  --line-strong:rgba(15,28,80,.17);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.07),0 12px 32px rgba(0,0,0,.09);
  --shadow-lg:0 4px 16px rgba(0,0,0,.09),0 28px 64px rgba(0,0,0,.14);
  --radius-xl:20px;--radius-lg:16px;--radius-md:12px;--radius-sm:10px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring-snappy:cubic-bezier(.28,1.36,.56,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --decelerate:cubic-bezier(0,0,.2,1);
  --standard:cubic-bezier(.4,0,.2,1);
}
/* === NOTURNO (DARK PREMIUM) === */
:root[data-theme="noturno"]{
  --accent:#7B6EFF;--accent-fill:rgba(123,110,255,.15);--accent-border:rgba(123,110,255,.28);
  --bg:#070B13;--panel:#0D1120;--panel-2:#131929;
  --ink:#E8EEFF;--ink-2:rgba(232,238,255,.72);--ink-3:rgba(232,238,255,.42);--ink-4:rgba(232,238,255,.20);
  --muted:rgba(232,238,255,.48);
  --fill-1:rgba(123,110,255,.12);--fill-2:rgba(255,255,255,.06);--fill-3:rgba(255,255,255,.04);--fill-4:rgba(255,255,255,.02);
  --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);
  --shadow-sm:0 0 0 .5px rgba(255,255,255,.05),0 4px 16px rgba(0,0,0,.50);
  --shadow:0 0 0 .5px rgba(255,255,255,.05),0 8px 32px rgba(0,0,0,.62);
  --shadow-lg:0 4px 20px rgba(0,0,0,.58),0 28px 64px rgba(0,0,0,.78);
}
/* === DIA (LIGHT CLARO) === */
:root[data-theme="dia"]{
  --accent:#3054D0;--accent-fill:rgba(48,84,208,.10);--accent-border:rgba(48,84,208,.24);
  --bg:#EFF2FB;--panel:#FFFFFF;--panel-2:#E4E9F7;
  --ink:#111827;--ink-2:rgba(17,24,39,.58);--ink-3:rgba(17,24,39,.34);--ink-4:rgba(17,24,39,.17);
  --muted:#6B748A;
  --fill-1:rgba(48,84,208,.08);--fill-2:rgba(17,30,80,.07);--fill-3:rgba(17,30,80,.045);--fill-4:rgba(17,30,80,.025);
  --line:rgba(15,28,80,.09);--line-strong:rgba(15,28,80,.17);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.07),0 12px 32px rgba(0,0,0,.09);
  --shadow-lg:0 4px 16px rgba(0,0,0,.09),0 28px 64px rgba(0,0,0,.14);
}
/* === FOGUEIRA (DARK ÂMBAR) === */
:root[data-theme="fogueira"]{
  --accent:#E8870A;--accent-fill:rgba(232,135,10,.14);--accent-border:rgba(232,135,10,.28);
  --bg:#0D0A06;--panel:#1A1410;--panel-2:#231C14;
  --ink:#F8EFE0;--ink-2:rgba(248,239,224,.72);--ink-3:rgba(248,239,224,.44);--ink-4:rgba(248,239,224,.22);
  --muted:rgba(248,239,224,.50);
  --fill-1:rgba(200,140,40,.16);--fill-2:rgba(200,140,40,.10);--fill-3:rgba(200,140,40,.07);--fill-4:rgba(200,140,40,.04);
  --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.14);
  --shadow-sm:0 0 0 .5px rgba(255,200,100,.05),0 4px 16px rgba(0,0,0,.50);
  --shadow:0 0 0 .5px rgba(255,200,100,.05),0 8px 28px rgba(0,0,0,.58);
  --shadow-lg:0 4px 16px rgba(0,0,0,.58),0 24px 60px rgba(0,0,0,.72);
}
/* === USP (VERMELHO INSTITUCIONAL) === */
:root[data-theme="usp"]{
  --accent:#C80010;--accent-fill:rgba(200,0,16,.09);--accent-border:rgba(200,0,16,.22);
  --bg:#FAF8F5;--panel:#FFFFFF;--panel-2:#F3EFE9;
  --ink:#1A0A06;--ink-2:rgba(26,10,6,.58);--ink-3:rgba(26,10,6,.34);--ink-4:rgba(26,10,6,.16);
  --muted:#7A6860;
  --fill-1:rgba(200,0,16,.07);--fill-2:rgba(100,40,20,.07);--fill-3:rgba(100,40,20,.045);--fill-4:rgba(100,40,20,.025);
  --line:rgba(100,30,10,.09);--line-strong:rgba(100,30,10,.18);
  --shadow-sm:0 1px 3px rgba(80,20,0,.07),0 4px 12px rgba(80,20,0,.05);
  --shadow:0 2px 8px rgba(80,20,0,.08),0 12px 32px rgba(80,20,0,.10);
  --shadow-lg:0 4px 16px rgba(80,20,0,.10),0 28px 64px rgba(80,20,0,.16);
}
/* === GIZ (MINIMAL CLARO) === */
:root[data-theme="giz"]{
  --accent:#0A0A0A;--accent-fill:rgba(10,10,10,.06);--accent-border:rgba(10,10,10,.15);
  --bg:#FAFAFA;--panel:#FFFFFF;--panel-2:#F2F2F2;
  --ink:#0A0A0A;--ink-2:rgba(10,10,10,.65);--ink-3:rgba(10,10,10,.38);--ink-4:rgba(10,10,10,.18);
  --muted:rgba(10,10,10,.42);
  --fill-1:rgba(0,0,0,.06);--fill-2:rgba(0,0,0,.04);--fill-3:rgba(0,0,0,.026);--fill-4:rgba(0,0,0,.013);
  --line:rgba(0,0,0,.09);--line-strong:rgba(0,0,0,.17);
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.09);
  --shadow-lg:0 4px 16px rgba(0,0,0,.10),0 28px 64px rgba(0,0,0,.16);
}
/* === PEDRA (MINIMAL ESCURO) === */
:root[data-theme="pedra"]{
  --accent:#F0F0F0;--accent-fill:rgba(240,240,240,.09);--accent-border:rgba(240,240,240,.20);
  --bg:#0A0A0A;--panel:#111111;--panel-2:#1C1C1C;
  --ink:#F5F5F5;--ink-2:rgba(245,245,245,.74);--ink-3:rgba(245,245,245,.44);--ink-4:rgba(245,245,245,.22);
  --muted:rgba(245,245,245,.50);
  --fill-1:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.055);--fill-3:rgba(255,255,255,.038);--fill-4:rgba(255,255,255,.02);
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
  --shadow-sm:0 0 0 .5px rgba(255,255,255,.06),0 4px 16px rgba(0,0,0,.65);
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.75);
  --shadow-lg:0 4px 16px rgba(0,0,0,.75),0 24px 60px rgba(0,0,0,.90);
}
/* === SOMBRA (PRETO + ANIMAÇÃO VIVA) === */
:root[data-theme="sombra"]{
  --accent:#F0F0F0;--accent-fill:rgba(240,240,240,.09);--accent-border:rgba(240,240,240,.20);
  --bg:#0A0A0A;--panel:#111111;--panel-2:#1C1C1C;
  --ink:#F5F5F5;--ink-2:rgba(245,245,245,.74);--ink-3:rgba(245,245,245,.44);--ink-4:rgba(245,245,245,.22);
  --muted:rgba(245,245,245,.50);
  --fill-1:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.055);--fill-3:rgba(255,255,255,.038);--fill-4:rgba(255,255,255,.02);
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
  --shadow-sm:0 0 0 .5px rgba(255,255,255,.06),0 4px 16px rgba(0,0,0,.65);
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.75);
  --shadow-lg:0 4px 16px rgba(0,0,0,.75),0 24px 60px rgba(0,0,0,.90);
}
/* === NEBLINA (BRANCO + ANIMAÇÃO VIVA) === */
:root[data-theme="neblina"]{
  --accent:#0A0A0A;--accent-fill:rgba(10,10,10,.06);--accent-border:rgba(10,10,10,.15);
  --bg:#FAFAFA;--panel:#FFFFFF;--panel-2:#F2F2F2;
  --ink:#0A0A0A;--ink-2:rgba(10,10,10,.65);--ink-3:rgba(10,10,10,.38);--ink-4:rgba(10,10,10,.18);
  --muted:rgba(10,10,10,.42);
  --fill-1:rgba(0,0,0,.06);--fill-2:rgba(0,0,0,.04);--fill-3:rgba(0,0,0,.026);--fill-4:rgba(0,0,0,.013);
  --line:rgba(0,0,0,.09);--line-strong:rgba(0,0,0,.17);
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.09);
  --shadow-lg:0 4px 16px rgba(0,0,0,.10),0 28px 64px rgba(0,0,0,.16);
}
/* === OVERRIDES DARK === */
:root[data-theme="noturno"] select,:root[data-theme="fogueira"] select,:root[data-theme="pedra"] select,:root[data-theme="sombra"] select{color-scheme:dark}
/* nav active + btn primary legíveis com accent claro/escuro */
:root[data-theme="giz"] .nav button.active,:root[data-theme="giz"] .btn.primary{color:#fff}
:root[data-theme="neblina"] .nav button.active,:root[data-theme="neblina"] .btn.primary{color:#fff}
:root[data-theme="pedra"] .nav button.active,:root[data-theme="pedra"] .btn.primary{color:#000}
:root[data-theme="sombra"] .nav button.active,:root[data-theme="sombra"] .btn.primary{color:#000}
/* giz/pedra: WebGL fica dessaturado — sombra/neblina têm animação viva propositalmente */
:root[data-theme="giz"] #webgl-bg,:root[data-theme="pedra"] #webgl-bg{opacity:.18;filter:saturate(0)}
:root[data-theme="giz"] .hero.morning,:root[data-theme="giz"] .hero.afternoon,
:root[data-theme="giz"] .hero.evening,:root[data-theme="giz"] .hero.night,
:root[data-theme="pedra"] .hero.morning,:root[data-theme="pedra"] .hero.afternoon,
:root[data-theme="pedra"] .hero.evening,:root[data-theme="pedra"] .hero.night,
:root[data-theme="sombra"] .hero.morning,:root[data-theme="sombra"] .hero.afternoon,
:root[data-theme="sombra"] .hero.evening,:root[data-theme="sombra"] .hero.night,
:root[data-theme="neblina"] .hero.morning,:root[data-theme="neblina"] .hero.afternoon,
:root[data-theme="neblina"] .hero.evening,:root[data-theme="neblina"] .hero.night{background:none!important}
/* === AUTO DARK (SISTEMA → NOTURNO) === */
@media(prefers-color-scheme:dark){
  :root:not([data-theme]){
    --accent:#7B6EFF;--accent-fill:rgba(123,110,255,.15);--accent-border:rgba(123,110,255,.28);
    --bg:#070B13;--panel:#0D1120;--panel-2:#131929;
    --ink:#E8EEFF;--ink-2:rgba(232,238,255,.72);--ink-3:rgba(232,238,255,.42);--ink-4:rgba(232,238,255,.20);
    --muted:rgba(232,238,255,.48);
    --fill-1:rgba(123,110,255,.12);--fill-2:rgba(255,255,255,.06);--fill-3:rgba(255,255,255,.04);--fill-4:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.13);
    --shadow-sm:0 0 0 .5px rgba(255,255,255,.05),0 4px 16px rgba(0,0,0,.50);
    --shadow:0 0 0 .5px rgba(255,255,255,.05),0 8px 32px rgba(0,0,0,.62);
    --shadow-lg:0 4px 20px rgba(0,0,0,.58),0 28px 64px rgba(0,0,0,.78);
  }
  :root:not([data-theme]) select{color-scheme:dark}
  :root:not([data-theme]) .sidebar{background:rgba(13,17,32,.88)}
  :root:not([data-theme]) .mobile-nav{background:rgba(13,17,32,.92)}
}
/* === KEYFRAMES SPRING === */
@keyframes springIn{0%{opacity:0;transform:scale(.90) translateY(14px)}60%{opacity:1;transform:scale(1.02) translateY(-2px)}100%{opacity:1;transform:none}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes swipeSlide{0%{transform:translateX(0)}50%{transform:translateX(44px);opacity:.6}100%{transform:translateX(0);opacity:1}}
@keyframes flamePulse{0%{transform:scale(1) rotate(-3deg);filter:brightness(1)}33%{transform:scale(1.22) rotate(3deg);filter:brightness(1.15) hue-rotate(8deg)}66%{transform:scale(.94) rotate(-2deg);filter:brightness(.96)}100%{transform:scale(1) rotate(-3deg);filter:brightness(1)}}
@keyframes donutSpin{from{stroke-dashoffset:282}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.30)}70%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes barFill{from{width:0%!important}}
@keyframes toastUp{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes modalUp{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--ink);font-family:'Inter',ui-rounded,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100dvh;font-size:15px}
button,input,select,textarea{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
*:focus-visible{outline:3px solid var(--accent-border);outline-offset:2px;border-radius:inherit}
button:focus-visible,.card-part:focus-visible{border-radius:12px}
#bg-gradient{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.app{min-height:100dvh;display:grid;grid-template-columns:224px minmax(0,1fr);position:relative;z-index:1}
.sidebar{position:sticky;top:0;height:100svh;padding:20px 10px;display:flex;flex-direction:column;background:rgba(242,242,247,.82);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-right:.5px solid var(--line);z-index:20;overflow-y:auto}
:root[data-theme="noturno"] .sidebar{background:rgba(13,17,32,.88)}
:root[data-theme="fogueira"] .sidebar{background:rgba(26,20,16,.88)}
:root[data-theme="usp"] .sidebar{background:rgba(250,248,245,.84)}
:root[data-theme="giz"] .sidebar{background:rgba(255,255,255,.92)}
:root[data-theme="pedra"] .sidebar{background:rgba(0,0,0,.94)}
:root[data-theme="sombra"] .sidebar{background:rgba(0,0,0,.92)}
:root[data-theme="neblina"] .sidebar{background:rgba(255,255,255,.90)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}
.brand-mark{width:40px;height:40px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.brand strong{display:block;font-size:13px;font-weight:700;letter-spacing:-.012em}
.brand span{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-top:2px;text-transform:uppercase}
.nav-label{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:10px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;color:var(--ink-2);padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;letter-spacing:-.006em;text-align:left;transition:background 120ms var(--standard),color 120ms}
.nav button:hover{background:var(--fill-3);color:var(--ink)}
.nav button.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}
.nav button:active{transform:scale(.97);transition-duration:80ms}
.nav-icon{width:18px;text-align:center;font-size:14px;opacity:.88}
.nav button.active .nav-icon{opacity:1}
.sidebar-foot{margin-top:auto;padding:12px 12px;color:var(--ink-3);font-size:11px;line-height:1.5}
.main{min-width:0}
.content{max-width:1640px;margin:auto;padding:30px 36px 80px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.page-title h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.06;color:var(--ink)}
.page-title p{margin:8px 0 0;font-size:13px;color:var(--ink-2);letter-spacing:-.006em}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.btn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:0 16px;height:44px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;letter-spacing:-.01em;box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:6px;transition:transform 120ms var(--spring),box-shadow 200ms var(--standard),border-color 160ms,background 120ms}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:active{transform:scale(.96);transition-duration:80ms;filter:brightness(.94)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--fill-3)}
.btn.icon{width:44px;padding:0;display:grid;place-items:center}
.card{background:var(--panel);border:.5px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.home-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:14px}
.hero{padding:28px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent);filter:blur(40px);pointer-events:none}
.hero-kicker{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
.hero h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.022em;line-height:1.1;max-width:600px}
.hero p{margin:10px 0 0;color:var(--ink-2);font-size:13px;line-height:1.55;max-width:560px;letter-spacing:-.006em}
.date-panel{padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.date-panel .day{font-size:60px;line-height:.9;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums}
.date-panel .month{margin-top:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.date-panel .picker{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.select{width:100%;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:10px 11px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;outline:none;transition:border-color 160ms,box-shadow 160ms}
.select:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-fill)}
select option,select optgroup{background:var(--panel);color:var(--ink)}
:root[data-theme="dia"] select,:root[data-theme="usp"] select,:root[data-theme="giz"] select{color-scheme:light}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:28px 0 14px}
.section-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.018em}
.section-head p{margin:4px 0 0;color:var(--ink-2);font-size:12px;letter-spacing:-.006em}
.muted{color:var(--muted)}

.home-task .subject-name{display:none}
.home-task .task-title{font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.012em;color:var(--ink)}

.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08),0 4px 14px color-mix(in srgb,var(--task-color,#888) 18%,transparent);

  animation:springIn 320ms var(--spring) calc(var(--i,0) * 22ms) both;
  transition:transform 180ms var(--spring),box-shadow 180ms var(--standard),filter 260ms var(--standard),opacity 260ms var(--standard);
}
.agenda-task .task-title{-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.agenda-task:hover{transform:translateY(-3px) scale(1.008);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 2px 6px rgba(0,0,0,.08),0 12px 28px color-mix(in srgb,var(--task-color,#888) 28%,transparent)}

    border:.5px solid var(--line);border-radius:26px;z-index:80;padding:6px;
    box-shadow:0 8px 32px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.06)
  }
  :root[data-theme="noturno"] .mobile-nav{background:rgba(13,17,32,.94)}
  :root[data-theme="fogueira"] .mobile-nav{background:rgba(26,20,16,.94)}
  :root[data-theme="pedra"] .mobile-nav{background:rgba(0,0,0,.94)}
  :root[data-theme="sombra"] .mobile-nav{background:rgba(0,0,0,.94)}
  :root[data-theme="neblina"] .mobile-nav{background:rgba(255,255,255,.94)}
  .mobile-nav-pill{position:absolute;top:6px;height:calc(100% - 12px);background:var(--ink);border-radius:20px;z-index:0;pointer-events:none;transition:left 300ms cubic-bezier(.34,1.2,.64,1),width 300ms cubic-bezier(.34,1.2,.64,1)}
  .mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:-.008em;position:relative;z-index:1;transition:color 150ms,transform 100ms;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;-webkit-tap-highlight-color:transparent}
  .mobile-nav button:active{transform:scale(0.90)}
  .mobile-nav button.active{color:var(--bg)}
  .mobile-nav span{display:flex;justify-content:center;align-items:center;height:26px}
}

/* === OVERRIDES & FIXES === */

/* ===== gráficos de progresso ===== */
.progress-donuts{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:4px 0}
.donut-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default}
.donut-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sparkline-card{padding:16px 18px;overflow:hidden}
/* Telegram link buttons */
.tg-link{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--fill-2);color:var(--ink-2);font-size:14px;text-decoration:none;flex-shrink:0;transition:background 120ms;-webkit-tap-highlight-color:transparent}
.tg-link:hover{background:var(--fill-3)}
.tg-tiny{background:rgba(255,255,255,.18)!important;color:inherit!important}
.tg-tiny:hover{background:rgba(255,255,255,.28)!important}
/* Meta card unificado */
.meta-metric{margin-bottom:18px;padding-bottom:18px;border-bottom:.5px solid var(--line)}
.meta-metric:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.meta-num{font-size:26px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.meta-label{font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.sparkline-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
/* ===== fogo animado ===== */
.flame{display:inline-block;animation:flamePulse 1.9s ease-in-out infinite;transform-origin:50% 90%;font-size:18px;will-change:transform}
.streak-badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;letter-spacing:-.01em}
.streak-badge.hot{background:linear-gradient(135deg,rgba(255,107,0,.15),rgba(255,200,0,.12));color:#ff6b00;border:1px solid rgba(255,107,0,.22)}
.streak-badge.cold{background:var(--fill-3);color:var(--muted);border:1px solid var(--line)}
/* ===== seletor de dias (custom) ===== */
.day-chips{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.day-chip{border:1px solid var(--line);background:var(--fill-4);color:var(--ink-2);padding:5px 9px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;transition:background 120ms,color 120ms,border-color 120ms,transform 120ms var(--spring);-webkit-tap-highlight-color:transparent}
.day-chip:hover{background:var(--fill-2);transform:translateY(-1px)}
.day-chip.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.day-chip.today{border-color:var(--accent);color:var(--accent)}
.day-chip.today.active{color:#fff}
/* ===== contador de exercícios / metas ===== */
.ex-counter-card{padding:18px}
/* ===== block footer (questões + anki) ===== */
.block-footer{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--fill-3);border:.5px solid var(--line);display:flex;flex-direction:column;gap:8px}
.block-q-row{display:flex;align-items:center;gap:6px}
.block-q-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-strong);background:var(--fill-2);color:var(--ink);font-size:16px;font-weight:600;display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--spring),background 120ms;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.block-q-btn:hover{background:var(--fill-1);transform:scale(1.1)}
.block-q-btn:active{transform:scale(.88)}
.block-q-num{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink);min-width:32px;text-align:center}
.block-q-label{font-size:11px;color:var(--muted);flex:1}
.block-q-edit{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink-3);font-size:13px;display:grid;place-items:center;cursor:pointer;transition:background 120ms;-webkit-tap-highlight-color:transparent}
.block-q-edit:hover{background:var(--fill-2);color:var(--ink)}
.block-anki-label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2);-webkit-tap-highlight-color:transparent}
.block-anki-cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.block-anki-label.done{color:var(--accent)}
/* home block stats */
.home-block-stats{display:flex;flex-direction:column;gap:8px;margin-top:0}
.home-block-q-row{display:flex;align-items:center;gap:8px}
.home-block-q-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--fill-3);color:var(--ink);font-size:20px;font-weight:600;display:grid;place-items:center;transition:transform 120ms var(--spring),background 120ms;-webkit-tap-highlight-color:transparent}
.home-block-q-btn:hover{background:var(--fill-2);transform:scale(1.08)}
.home-block-q-btn:active{transform:scale(.9)}
.ex-title{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:12px;letter-spacing:-.006em}
.ex-controls{display:flex;align-items:center;gap:12px}
.ex-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--fill-3);color:var(--ink);font-size:18px;font-weight:600;display:grid;place-items:center;transition:transform 120ms var(--spring),background 120ms;-webkit-tap-highlight-color:transparent}
.ex-btn:hover{background:var(--fill-2);transform:scale(1.08)}
.ex-btn:active{transform:scale(.9)}
.ex-num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--ink);min-width:40px;text-align:center}
.ex-week{font-size:11px;color:var(--muted);margin-top:6px;font-weight:500}
.ex-task-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ex-task-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--fill-4);border:.5px solid var(--line);cursor:pointer;transition:background 120ms,transform 100ms}
.ex-task-row:hover{background:var(--fill-3);transform:translateX(2px)}
.ex-task-row.done{opacity:.4}
.ex-task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ex-task-name{flex:1;font-size:12px;font-weight:500;letter-spacing:-.006em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-task-badge{font-size:9px;font-weight:700;color:var(--ink-3);background:var(--fill-3);padding:2px 6px;border-radius:6px;flex-shrink:0}
/* ===== dias estudados ===== */
.days-studied{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);background:var(--fill-3);padding:4px 10px;border-radius:8px}
.days-studied strong{color:var(--ink);font-size:13px}
/* ===== matérias sem ícone, com módulos ===== */
.subject-module-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.subject-module-chip{font-size:9px;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.20);letter-spacing:-.004em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ===== mensagem personalizada ===== */
.greeting-msg{font-size:15px;font-weight:600;color:var(--ink);line-height:1.6;margin-bottom:0;letter-spacing:-.006em}
/* ===== visão compacta (semana inteira sem scroll) ===== */
.compact-toggle{font-size:11px;padding:0 10px;height:34px;border-radius:10px;white-space:nowrap}
.agenda-board.compact{grid-template-columns:repeat(7,1fr);overflow:visible;scroll-snap-type:none}
.agenda-board.compact .agenda-col{min-width:0}
.agenda-board.compact .task-list{min-height:0;gap:3px}
.agenda-board.compact .column-card{padding:9px 8px}
.agenda-board.compact .column-head strong{font-size:11px}
.agenda-board.compact .kind{display:none}
.agenda-board.compact .empty{padding:6px 8px;font-size:10px}
.compact-card{display:flex;align-items:center;gap:5px;height:29px;padding:0 7px 0 0;border-radius:7px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--task-color) 12%,var(--fill-3));border-left:3px solid var(--task-color);transition:opacity 160ms,background 160ms,transform 120ms var(--spring)}
.compact-card:hover{transform:translateX(2px);background:color-mix(in srgb,var(--task-color) 20%,var(--fill-3))}
.compact-card.done{opacity:.35}
.compact-card.done .compact-title{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.compact-dot{width:4px;height:4px;border-radius:50%;background:var(--task-color);flex-shrink:0;margin-left:6px}
.compact-subj{font-size:8px;font-weight:800;letter-spacing:.06em;color:var(--task-color);flex-shrink:0}
.compact-title{font-size:10px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.compact-check{font-size:10px;color:var(--task-color);flex-shrink:0;font-weight:700}
/* ===== filtros por matéria ===== */
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.filter-pill{border:1px solid var(--line-strong);background:var(--fill-4);color:var(--ink-2);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;transition:background 120ms,color 120ms,border-color 120ms;-webkit-tap-highlight-color:transparent;min-height:34px;display:inline-flex;align-items:center}
.filter-pill.active{background:var(--task-color,var(--accent));color:#fff;border-color:transparent}
.filter-pill-all.active{background:var(--ink);color:var(--bg);border-color:transparent}
/* ===== streak ===== */
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ff6b00,#ff9500);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(255,100,0,.30);letter-spacing:-.01em}
.streak-zero{opacity:.5;background:var(--fill-3);color:var(--ink-3);box-shadow:none}
/* ===== mini gráfico semanal ===== */
.week-chart{display:flex;gap:4px;align-items:flex-end;height:42px;margin-top:12px}
.week-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.week-bar-bg{flex:1;width:100%;border-radius:4px;background:var(--fill-3);position:relative;overflow:hidden;min-height:6px}
.week-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:4px;background:var(--accent);transition:height 500ms var(--ease-out)}
.week-bar-label{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.02em}
/* ===== confetti ===== */
.confetti-piece{position:fixed;top:0;pointer-events:none;z-index:9999;border-radius:2px;animation:confettiFall linear both}
/* ===== swipe feedback ===== */
.swipe-complete{animation:swipeSlide 300ms var(--spring) both}
/* ===== pointer drag ===== */
.agenda-task.drag-source{opacity:.35!important;transform:none!important}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.94;transform:rotate(1.5deg) scale(.96);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.24);transition:none!important;will-change:transform}
/* ===== sync status dot ===== */
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);vertical-align:middle;margin-right:5px;flex-shrink:0}
.sync-dot.connected{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sync-dot.error{background:#e62f34}
.sync-status{display:flex;align-items:center;font-size:12px;color:var(--ink-2)}
/* ===== card progress (sub-tarefas) ===== */
.card-progress{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.card-progress-head{display:flex;align-items:baseline;gap:6px;font-size:11px;font-weight:600;letter-spacing:-.008em}
.card-progress-head strong{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums lining-nums}
.card-progress-head span{opacity:.76}
.card-progress-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.card-progress-bar>div{height:100%;border-radius:inherit;background:rgba(255,255,255,.94);transition:width 380ms cubic-bezier(.16,1,.3,1)}
.card-parts{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.card-part{appearance:none;border:0;background:rgba(255,255,255,.20);color:inherit;border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.18);transition:transform 160ms var(--spring),box-shadow 180ms,background 180ms,opacity 180ms;max-width:100%}
.card-part:hover{transform:translateY(-2px);background:rgba(255,255,255,.3);box-shadow:0 9px 22px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.22)}
.card-part:active{transform:translateY(0) scale(.99);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.card-part.done{background:rgba(0,0,0,.10);opacity:.68;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);text-decoration:none}
.card-part .part-check{width:18px;height:18px;border-radius:7px;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;background:rgba(255,255,255,.08);font-size:10px;font-weight:800;transition:.18s}
.card-part.done .part-check{background:currentColor;color:color-mix(in srgb,var(--task-color) 85%,#000 15%);border-color:currentColor}
.card-part .part-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.card-part .part-label{font-size:9px;font-weight:900;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.card-part .part-status{font-size:7px;font-weight:850;opacity:.62;letter-spacing:.25px;text-transform:uppercase}
.part-editor{display:flex;flex-direction:column;gap:8px}
.part-editor-row{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}
.part-editor-row .input{margin:0}
.progress-note{font-size:8px;color:var(--muted);line-height:1.4;margin-top:6px}
@media(max-width:640px){.card-part{font-size:8px;padding:7px 8px}.card-progress{margin-top:11px}}


/* === TASK COURSE SOURCE === */
.task-source{font-size:9px;margin-top:5px;font-weight:600;letter-spacing:.01em;opacity:.68;display:inline-flex;align-items:center;gap:4px}
.task-source::before{content:'';display:inline-block;width:2.5px;height:2.5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.8}
.task-code{font-size:8px;font-weight:900;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.16);padding:2px 7px;border-radius:6px;letter-spacing:.08em;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}

/* === IMPROVED DRAG DROP === */
.insert-line{height:3px;border-radius:99px;background:var(--accent);margin:0 4px;box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent);pointer-events:none;animation:insertPulse 800ms ease-in-out infinite alternate;flex-shrink:0}
@keyframes insertPulse{from{opacity:.55}to{opacity:1}}
.agenda-task.drop-above{box-shadow:0 -3px 0 var(--accent),inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px color-mix(in srgb,var(--task-color,#888) 20%,transparent)!important}
.agenda-task.drop-below{box-shadow:0 3px 0 var(--accent),inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px color-mix(in srgb,var(--task-color,#888) 20%,transparent)!important}

/* === METAS DO DIA REDESIGN === */
.meta-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:900px){.meta-stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.meta-stats-row{grid-template-columns:repeat(2,1fr)}}
.meta-stat{padding:14px 15px;background:var(--panel);border:.5px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:3px;transition:transform 160ms var(--ease-out),box-shadow 160ms}
.meta-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.meta-stat .ms-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.meta-stat .ms-value{font-size:28px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink);line-height:1.05;margin-top:2px}
.meta-stat .ms-frac{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.meta-stat .ms-bar{height:4px;border-radius:99px;background:var(--fill-3);overflow:hidden;margin-top:8px}
.meta-stat .ms-bar>div{height:100%;border-radius:inherit;background:var(--accent);transition:width 400ms var(--standard)}

.meta-task-list{display:flex;flex-direction:column;gap:6px}
.meta-task-row{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel);border:.5px solid var(--line);border-radius:11px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform 120ms var(--spring),box-shadow 120ms}
.meta-task-row:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.meta-task-row.done{opacity:.42;filter:grayscale(1)}
.meta-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.meta-name{flex:1;min-width:0;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.006em}
.meta-badge{font-size:9px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;background:var(--fill-3);padding:3px 7px;border-radius:6px}

/* === MOBILE OPTIMIZATION === */
.home-chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* FAB — só visível no mobile */
.mobile-fab{display:none}
@media(max-width:900px){
  /* Conteúdo: respira acima da nav */
  .content{padding:20px 16px 100px;padding-bottom:max(100px,calc(92px + env(safe-area-inset-bottom)))}
}
@media(max-width:640px){
  /* === LAYOUT BASE === */
  .content{padding:14px 14px 104px;padding-bottom:max(104px,calc(94px + env(safe-area-inset-bottom)))}
  .home-chart-row{grid-template-columns:1fr!important}
  .subjects-grid{grid-template-columns:1fr!important}
  .theme-grid{grid-template-columns:repeat(2,1fr)!important}
  .meta-grid{grid-template-columns:1fr 1fr!important}

  /* === TOPBAR MINIMAL === */
  .page-title h1{font-size:24px!important;letter-spacing:-.025em}
  .page-title p{display:none}
  .page-title .eyebrow{font-size:10px;letter-spacing:.06em}
  .topbar{margin-bottom:16px;border-bottom:none!important}
  .top-actions{display:none!important}

  /* === FAB — Nova tarefa flutuante === */
  .mobile-fab{
    display:grid;place-items:center;
    position:fixed;right:16px;
    bottom:calc(88px + max(12px,env(safe-area-inset-bottom)));
    width:54px;height:54px;border-radius:17px;
    background:var(--accent);color:var(--bg);
    border:none;font-size:26px;font-weight:300;line-height:1;
    box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent),0 2px 6px rgba(0,0,0,.18);
    cursor:pointer;z-index:79;
    transition:transform 180ms cubic-bezier(.34,1.56,.64,1),box-shadow 180ms;
    -webkit-tap-highlight-color:transparent;
    will-change:transform
  }
  .mobile-fab:active{transform:scale(0.86);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}

  /* === HERO COMPACTO === */
  .hero{min-height:0!important;padding:16px 18px!important}
  .hero h2{font-size:20px!important;line-height:1.2}

  /* === SECTION HEAD === */
  .section-head{margin:18px 0 10px!important}
  .section-head h2{font-size:17px!important}
  .section-head p{display:none}

  /* === TASK CARDS — touch premium === */
  .home-task{
    grid-template-columns:46px minmax(0,1fr) auto!important;
    padding:13px 13px 13px 15px!important;
    min-height:62px;
    transition:transform 100ms,box-shadow 100ms
  }
  .home-task:active{transform:scale(0.980)!important;transition-duration:60ms!important}
  .home-task .check{width:46px!important;height:46px!important;border-radius:14px!important;font-size:18px!important}
  .home-task .task-title{font-size:14px!important;font-weight:600!important;letter-spacing:-.012em}
  .home-task .task-tools button.tiny{min-width:40px!important;min-height:40px!important}
  .agenda-task{transition:transform 100ms,box-shadow 100ms}
  .agenda-task:active{transform:scale(0.976)!important;transition-duration:60ms!important}
  .agenda-task-body{padding:11px 13px!important}
  .meta-task-row:active{transform:scale(0.972)!important;transition-duration:60ms!important}

  /* === DAY CHIPS === */
  .day-chips{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .day-chips::-webkit-scrollbar{display:none}
  .day-chip{padding:9px 14px!important;font-size:12px!important;min-height:40px;flex-shrink:0}

  /* === DONUTS — espaçados na horizontal === */
  .progress-donuts{justify-content:space-around;flex-wrap:nowrap;gap:4px;padding:6px 0}

  /* === META CARDS === */
  .meta-card{padding:12px 12px}
  .meta-stat{padding:12px 12px}
  .meta-stat .ms-value{font-size:24px}

  /* === AGENDA === */
  .agenda-board:not(.compact){scroll-snap-type:x mandatory!important;grid-template-columns:repeat(7,calc(100vw - 28px))!important}
  .agenda-board.compact{grid-template-columns:repeat(7,minmax(160px,1fr))!important;overflow-x:auto!important;scroll-snap-type:x mandatory!important}
  .agenda-board.compact .agenda-col{min-width:160px!important;scroll-snap-align:start!important}
  .agenda-col{min-width:calc(100vw - 28px)!important}
  .week-nav-btn{display:none!important}
  .agenda-nav-row{gap:0!important}
  .week-nav-inline{display:inline-flex!important;align-items:center;justify-content:center;padding:6px 12px!important;font-size:18px!important;font-weight:300!important;min-width:38px}
  .agenda-toolbar{flex-wrap:wrap;gap:6px}
  .agenda-toolbar .week-title{font-size:15px}
  .filter-bar{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-pill{white-space:nowrap;flex-shrink:0}

  /* === MODAL — bottom sheet === */
  .modal-backdrop{padding:0!important;align-items:flex-end!important}
  .modal{
    width:100%!important;max-height:93dvh!important;margin:0!important;
    border-radius:28px 28px 0 0!important;
    animation:sheetUp 360ms cubic-bezier(.34,1.1,.64,1) both!important
  }
  .modal::before{
    content:'';display:block;width:36px;height:4px;
    background:var(--line-strong);border-radius:99px;
    margin:12px auto 0;flex-shrink:0
  }
  .modal-head{padding:10px 20px 14px!important;border-radius:28px 28px 0 0!important}
  .modal-head strong{font-size:16px}
  .modal-body{padding:0 16px 12px!important;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal-foot{
    padding:10px 16px!important;
    padding-bottom:max(14px,calc(10px + env(safe-area-inset-bottom)))!important
  }
  .modal-foot .btn{min-height:50px!important;border-radius:14px!important;font-size:15px!important;font-weight:700!important}

  /* === FORMS no modal === */
  .form-grid{grid-template-columns:1fr!important}
  .form-group.full{grid-column:auto!important}

  /* === CARD PARTS === */
  .card-part{font-size:9px!important;padding:6px 9px!important}
  .card-progress{margin-top:9px!important}

  /* === MISCS === */
  .task-title{font-size:12.5px!important}
}

@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:380px){
  .content{padding:12px 11px 104px!important;padding-bottom:max(104px,calc(94px + env(safe-area-inset-bottom)))!important}
  .meta-grid{grid-template-columns:1fr!important}
  .meta-stat .ms-value{font-size:21px}
  .day-chip{padding:8px 10px!important;font-size:11px!important}
  .agenda-board:not(.compact){grid-template-columns:repeat(7,calc(100vw - 22px))!important}
  .mobile-fab{width:50px;height:50px;border-radius:15px;font-size:24px}
}
/* ===== HTML BASE BG (para transparência do body) ===== */
html{background:var(--bg)}
/* ===== BACKGROUND BLOBS ===== */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform}
.bg-blob.b1{width:65vw;height:65vw;background:rgba(69,109,255,.16);top:-15%;left:8%;animation:bgBlob1 22s ease-in-out infinite alternate}
.bg-blob.b2{width:55vw;height:55vw;background:rgba(234,88,12,.13);bottom:-12%;right:3%;animation:bgBlob2 28s ease-in-out infinite alternate}
.bg-blob.b3{width:50vw;height:50vw;background:rgba(91,164,216,.12);top:25%;right:12%;animation:bgBlob3 25s ease-in-out infinite alternate}
.bg-blob.b4{width:42vw;height:42vw;background:rgba(16,163,74,.10);bottom:18%;left:2%;animation:bgBlob4 32s ease-in-out infinite alternate}
@keyframes bgBlob1{from{transform:translate(0,0) scale(1)}to{transform:translate(14%,20%) scale(1.18)}}
@keyframes bgBlob2{from{transform:translate(0,0) scale(1)}to{transform:translate(-20%,-14%) scale(1.22)}}
@keyframes bgBlob3{from{transform:translate(0,0) scale(1)}to{transform:translate(-12%,18%) scale(.88)}}
@keyframes bgBlob4{from{transform:translate(0,0) scale(1)}to{transform:translate(18%,-12%) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.bg-blob{animation:none}}
/* ===== NAV SHIMMER ===== */
.nav button{position:relative;overflow:hidden}
.nav button::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-130%);pointer-events:none;transition:transform 0s}
.nav button:hover::after{transform:translateX(230%);transition:transform 480ms var(--ease-out)}
/* ===== ACTIVE NAV GLOW PULSE ===== */
@keyframes navGlow{0%,100%{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}50%{box-shadow:0 2px 22px color-mix(in srgb,var(--accent) 58%,transparent),0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent)}}
.nav button.active{animation:navGlow 3s ease-in-out infinite}
/* ===== BRAND MARK SPIN ===== */
.brand-mark{cursor:pointer;transition:transform 700ms cubic-bezier(.34,1.56,.64,1)}
.brand-mark.spinning{transform:rotate(360deg)}
/* ===== TASK SLIDE-IN STAGGER ===== */
@keyframes taskSlideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.home-task{animation:taskSlideIn 380ms var(--ease-out) both;animation-delay:calc(var(--i,0)*52ms)}
/* ===== STRIKETHROUGH DRAW ===== */
.home-task.done .task-title{position:relative}
.home-task.done .task-title::after{content:'';position:absolute;left:0;top:50%;height:1.5px;background:currentColor;opacity:.45;animation:strikeDraw 300ms var(--ease-out) forwards}
@keyframes strikeDraw{from{width:0}to{width:100%}}
/* ===== PARTICLES ===== */
.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:9999;animation:particlePop 650ms var(--ease-out) forwards}
@keyframes particlePop{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px,0px),var(--py,-50px)) scale(0)}}
/* ===== CONFETTI ===== */
.confetti-p{position:fixed;pointer-events:none;border-radius:2px;z-index:9999;animation:confettiFall 1.4s var(--ease-out) forwards}
@keyframes confettiFall{0%{opacity:1;transform:translate(0,0) rotate(0deg)}100%{opacity:0;transform:translate(var(--cx,0px),var(--cy,90px)) rotate(var(--cr,360deg))}}
/* ===== SUBJECT CARD SHEEN ===== */
.subject-card{overflow:hidden}
.subject-card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.20) 50%,transparent 68%);transform:translateX(-130%);pointer-events:none}
.subject-card:hover::after{transform:translateX(160%);transition:transform 600ms var(--ease-out)}
/* ===== RAIO-X BAR ENTRANCE ===== */
.raio-x-bar-fill{transform:scaleX(0);transform-origin:left;transition:transform 680ms var(--ease-out)}
.raio-x-bar-fill.anim-in{transform:scaleX(1)}
/* ===== AGENDA ACCENT STRIP GLOW ===== */
.accent-strip{transition:box-shadow 200ms}
.agenda-task:hover .accent-strip{box-shadow:8px 0 28px color-mix(in srgb,var(--task-color) 55%,transparent)}
/* ===== VIEW ENTRANCE ===== */
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view.entering{animation:viewIn 320ms var(--ease-out) both}
/* ===== VOLUME GOAL LINE PULSE ===== */
.goal-line-group{animation:goalPulse 2.5s ease-in-out infinite}
@keyframes goalPulse{0%,100%{opacity:.65}50%{opacity:1}}
/* ===== STREAK FIRE SHAKE ===== */
@keyframes fireShake{0%,100%{transform:rotate(0deg) scale(1)}30%{transform:rotate(-10deg) scale(1.1)}70%{transform:rotate(10deg) scale(1.1)}}
.flame{display:inline-block;animation:fireShake 1.2s ease-in-out infinite}
/* ===== HERO TIME-OF-DAY ===== */
.hero.morning{background:linear-gradient(135deg,rgba(251,146,60,.10) 0%,var(--panel) 55%)!important}
.hero.afternoon{background:linear-gradient(135deg,rgba(69,109,255,.10) 0%,var(--panel) 55%)!important}
.hero.evening{background:linear-gradient(135deg,rgba(139,92,246,.10) 0%,var(--panel) 55%)!important}
.hero.night{background:linear-gradient(135deg,rgba(15,23,60,.15) 0%,var(--panel) 55%)!important}
/* ===== GREETING WORD REVEAL ===== */
@keyframes wordIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.greeting-word{display:inline-block;animation:wordIn 420ms var(--ease-out) both}
/* ===== Glass & Mouse FX ===== */
.sidebar{backdrop-filter:blur(72px) saturate(220%)!important;-webkit-backdrop-filter:blur(72px) saturate(220%)!important}
.card{backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important}
.modal-backdrop{backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important}
.spotlight{position:fixed;width:960px;height:960px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 6%,transparent) 0%,transparent 58%);pointer-events:none;z-index:1;border-radius:50%;left:0;top:0;will-change:transform;transform:translate(-9999px,-9999px)}
@media(prefers-reduced-motion:reduce){.spotlight{display:none}}
/* nav pill deslizante (desktop) */
.nav{position:relative}
.dnav-pill{position:absolute;left:0;right:0;top:0;height:38px;border-radius:10px;background:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent);pointer-events:none;z-index:0;will-change:transform;transition:transform 280ms cubic-bezier(.34,1.2,.64,1),height 280ms cubic-bezier(.34,1.2,.64,1),opacity 180ms linear}
.nav button{position:relative;z-index:1}
.nav button.active{background:transparent!important;box-shadow:none!important}
/* theme crossfade flash */
#theme-flash{position:fixed;inset:0;background:var(--panel);pointer-events:none;z-index:9998;opacity:0;transition:opacity 200ms}
/* questões externas na agenda */
.ext-ex-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;margin-top:6px;border-radius:10px;background:var(--fill-2);gap:8px}
.ext-ex-label{font-size:11px;font-weight:600;color:var(--muted);flex:1;letter-spacing:-.01em}
.ext-ex-ctrl{display:flex;align-items:center;gap:5px}
.ext-ex-count{font-size:13px;font-weight:800;color:var(--ink);min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.ext-ex-btn{width:24px;height:24px;border-radius:7px;border:none;background:var(--fill-3);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:background 120ms,color 120ms;flex-shrink:0}
.ext-ex-btn:hover{background:var(--accent);color:#fff}
/* ===== WEBGL BG CANVAS ===== */
#webgl-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* ===== GRAIN TEXTURE ===== */
#grain-overlay{position:fixed;inset:-30%;width:160%;height:160%;z-index:2;pointer-events:none;opacity:.038;animation:grainMove .45s steps(1) infinite}
@keyframes grainMove{0%{transform:translate(0,0)}17%{transform:translate(-5%,-10%)}33%{transform:translate(-11%,5%)}50%{transform:translate(4%,-8%)}67%{transform:translate(-8%,11%)}83%{transform:translate(8%,-4%)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){#grain-overlay{animation:none}}
/* ===== AMBIENT GLOW ===== */
.subject-card{--subj-color:var(--accent)}
.subject-card:hover{box-shadow:0 28px 70px color-mix(in srgb,var(--subj-color) 28%,transparent),var(--shadow-lg)!important;transition:box-shadow 300ms,transform 80ms}
.agenda-task:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 2px 6px rgba(0,0,0,.08),0 22px 56px color-mix(in srgb,var(--task-color,#888) 38%,transparent)!important}
/* ===== DIGIT SLOT MACHINE ===== */
.digit-slot{display:inline-block;animation:digitRoll 260ms var(--ease-out) both}
@keyframes digitRoll{from{transform:translateY(calc(var(--dir,1)*-20px));opacity:0}to{transform:none;opacity:1}}
/* ===== MAGNETIC BUTTON ===== */
.btn,.ex-btn,.nav button{will-change:transform}
/* ===== COMMAND PALETTE ===== */
#cmd-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.46);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10001;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;opacity:0;pointer-events:none;transition:opacity 170ms}
#cmd-backdrop.open{opacity:1;pointer-events:auto}
#cmd-palette{width:min(640px,92vw);background:var(--panel);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 40px 90px rgba(0,0,0,.42);overflow:hidden;transform:scale(.95) translateY(-14px);transition:transform 220ms var(--ease-out)}
#cmd-backdrop.open #cmd-palette{transform:none}
#cmd-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
#cmd-icon{color:var(--muted);flex-shrink:0}
#cmd-input{flex:1;border:none;background:transparent;color:var(--ink);font-size:16px;font-weight:500;outline:none;letter-spacing:-.015em;min-width:0}
#cmd-input::placeholder{color:var(--muted)}
#cmd-kbd-hint{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ck{display:inline-block;background:var(--fill-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10px;font-weight:700;color:var(--muted);font-family:monospace;letter-spacing:0}
#cmd-results{max-height:400px;overflow-y:auto;padding:6px}
.cmd-sec{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:8px 14px 4px;margin-top:2px}
.cmd-item{padding:9px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background 70ms;user-select:none}
.cmd-item:hover,.cmd-item.cmd-sel{background:var(--fill-2)}
.cmd-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex-shrink:0;background:var(--fill-2)}
.cmd-txt .cmd-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.cmd-txt .cmd-sub{font-size:11px;color:var(--muted);margin-top:2px}
.cmd-empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

/* ===== SUPERDESIGN COMPONENTS ===== */
/* 1. Glowing Edge Card */
.agenda-task:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 2px 6px rgba(0,0,0,.08),0 8px 20px rgba(0,0,0,.10),0 0 32px color-mix(in srgb,var(--task-color) 55%,transparent)!important}
.home-task:hover{box-shadow:var(--shadow),0 0 20px color-mix(in srgb,var(--task-color,var(--accent)) 22%,transparent)!important}

/* 2. Light Beam Button */
@keyframes lightBeam{0%{left:-60%}100%{left:130%}}
.btn.primary{overflow:hidden;position:relative}
.btn.primary::after{content:'';position:absolute;top:-20%;left:-60%;width:38%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);animation:lightBeam 2.6s ease-in-out infinite;pointer-events:none;border-radius:0}

/* 3. Jelly Squish Check Button */
@keyframes jellySquish{0%{transform:scale(1)}25%{transform:scale(1.28,.78)}50%{transform:scale(.86,1.18)}75%{transform:scale(1.08,.93)}100%{transform:scale(1)}}
.home-task .check:active,.agenda-task .tiny:active{animation:jellySquish 380ms var(--spring) forwards!important;transition:none!important}
.home-task.just-checked .check{animation:jellySquish 380ms var(--spring)!important}

/* 4. Tilted Card (3D) — JS adds inline style */
.home-task,.card,.agenda-task{will-change:transform}
.tilt-card{transition:transform 80ms linear,box-shadow 180ms var(--standard)}

/* 5. Shrinking Sticky Header */
.content{transition:padding-top 220ms var(--standard)}
.topbar{transition:padding 200ms var(--standard),box-shadow 200ms;position:sticky;top:0;z-index:10;background:var(--bg);padding-top:30px;padding-bottom:0;margin-bottom:0}
@media(max-width:900px){.topbar{position:relative;padding-top:20px!important;box-shadow:none!important}}
.topbar.shrunk{padding-top:10px!important;padding-bottom:8px!important;box-shadow:0 1px 0 var(--line-strong)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* 6. Pill Nav */
.nav{position:relative}
.nav-pill-el{position:absolute;left:4px;right:4px;border-radius:10px;background:var(--accent);z-index:0;pointer-events:none;transition:top 280ms cubic-bezier(.34,1.36,.64,1),height 200ms var(--standard);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 32%,transparent)}
.nav button{position:relative;z-index:1}
.nav button.active{background:transparent!important;box-shadow:none!important}
.nav button.active::after{content:'';position:absolute;inset:0;border-radius:10px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.22),transparent 70%);pointer-events:none;z-index:2}

/* 7. Staggered Menu */
@keyframes menuSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.nav button{animation:menuSlideIn 280ms var(--ease-out) calc(var(--nav-i,0)*35ms) both}

/* 8. Glow Cursor on Buttons */
.btn::before{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26) 0%,transparent 68%);left:var(--cx,-999px);top:var(--cy,-999px);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 180ms}
.btn:hover::before{opacity:1}

/* 9. Flowing Sidebar Menu */
.nav button:not(.active):hover{padding-left:18px!important}

/* 10. Animated Stepper */
.stepper-wrap{padding:14px 16px 10px}
.stepper-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.stepper-scroll{display:flex;gap:0;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.stepper-scroll::-webkit-scrollbar{height:3px}
.stepper-scroll::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:3px}
.step-connector{width:18px;height:2px;background:var(--fill-3);flex-shrink:0;align-self:center;margin-top:-22px;border-radius:1px}
.step-connector.done-conn{background:var(--accent);opacity:.45}
.step-node{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;width:52px}
.step-node:hover .step-circle{transform:translateY(-3px) scale(1.1)}

function getGreeting(){
  const h=new Date().getHours();
  const pool=h<12?_MSGS.morning:h<18?_MSGS.afternoon:_MSGS.evening;
  return pool[new Date().getDate()%pool.length];
}
function todayKey(){return new Date().toISOString().slice(0,10)}
function weekStartKey(){return mondayOf(new Date()).toISOString().slice(0,10)}
function chExtEx(key,delta){
  if(!state.exerciseLog)state.exerciseLog={};
  state.exerciseLog[key]=Math.max(0,(state.exerciseLog[key]||0)+delta);
  save();
  const el=document.getElementById('extex-'+key);
  if(el)el.textContent=state.exerciseLog[key];
}
function adjustExercises(delta){
  const k=todayKey();
  if(!state.exerciseLog)state.exerciseLog={};
  const prev=state.exerciseLog[k]||0;
  state.exerciseLog[k]=Math.max(0,prev+delta);
  const goal=state.dailyExGoal||50;
  if(state.exerciseLog[k]>=goal&&prev<goal)spawnConfetti();
  save();
  const v=state.exerciseLog[k]||0;
  const el=document.getElementById('exCountDisplay');
  if(el){const prev2=parseInt(el.dataset.val||'0')||0;el.dataset.val=v;const dir=v>=prev2?-1:1;el.innerHTML=String(v).split('').map((d,i)=>`<span class="digit-slot" style="animation-delay:${i*38}ms;--dir:${dir}">${d}</span>`).join('');}
  const bar=document.querySelector('#exQBar>div');
  if(bar)bar.style.width=Math.min(100,Math.round(v/(state.dailyExGoal||50)*100))+'%';
}
function donutChart(percent,color,label,size=80){
  const r=28,circ=2*Math.PI*r,fill=Math.min(Math.max(percent,0),100)/100*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--fill-3)" stroke-width="7.5"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="7.5" stroke-dasharray="${fill.toFixed(2)} ${circ.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 36 36)" style="transition:stroke-dasharray 700ms cubic-bezier(.16,1,.3,1)"/><text x="36" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)" font-family="inherit">${percent}%</text><text x="36" y="48" text-anchor="middle" font-size="8" fill="var(--muted)" font-family="inherit">${label}</text></svg>`;
}
function exVolumeChart(){
  const days=21;
  const goal=state.dailyExGoal||50;
  const data=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const dow=d.getDay(); // 0=dom … 6=sáb — sábado é dia de redação, sem meta de questões
    const isEx=dow!==6;
    const label=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','').replace(' ','<br>');
    const shortLabel=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
    data.push({key,label,shortLabel,v:state.exerciseLog?.[key]||0,isEx,isToday:i===0});
  }
  const maxV=Math.max(goal,Math.max(1,...data.map(d=>d.v)));
  const W=800,H=110,padL=36,padR=8,padT=12,padB=32;
  const iw=W-padL-padR,ih=H-padT-padB;
  const bw=Math.max(4,iw/days-2);
  const bars=data.map((d,i)=>{
    const x=padL+i/days*iw+bw*0.1;
    const bh=Math.max(2,d.v/maxV*ih);
    const y=padT+ih-bh;
    const col=d.isToday?'var(--accent)':d.isEx?'var(--accent)':'var(--line-strong)';
    const op=d.isToday?1:d.isEx?0.55:0.28;
    const showLabel=i===0||i===days-1||d.isToday||(i%7===0);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.8).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}" opacity="${op}" class="ex-bar" data-v="${d.v}" data-label="${d.shortLabel}" onmouseenter="exBarHover(this,event)" onmouseleave="exBarOut()"/>`
      +(showLabel?`<text x="${(x+bw*0.4).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7.5" fill="var(--muted)" font-family="inherit">${d.isToday?'hoje':d.shortLabel.split(' ')[0]}</text>`:'');
  }).join('');
  const goalY=(padT+ih-goal/maxV*ih).toFixed(1);

function _pickMsg(arr,...args){return arr[Math.floor(Math.random()*arr.length)](...args);}
function _notify(tag,title,body,opts={}){

let _notifTimers={};
function _schedAt(tag,h,m,fn){
  clearTimeout(_notifTimers[tag]);
  const now=new Date();
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
  if(t<=now)t.setDate(t.getDate()+1);
  _notifTimers[tag]=setTimeout(()=>{fn();_schedAt(tag,h,m,fn);},t-now);
}

function scheduleLocalReminder(){
  if(!state.notificationsEnabled||Notification.permission!=='granted')return;
  const [hm,mm]=(state.reminderTime||'07:00').split(':').map(Number);

  // 1. Lembrete matinal (horário configurável, padrão 07:00)
  _schedAt('manha',hm,mm,()=>{
    const dow=DOW_KEYS[new Date().getDay()];
    const pending=currentWeekTasks().filter(t=>t.day===dow&&!t.done);
    if(pending.length>0)_notify('manha','FUVEST OS — Bom dia',_pickMsg(NOTIF_MSGS_MANHA,pending.length));
  });

  // 2. Pressão da tarde (15:00) — só dispara se ainda tem tarefas abertas
  _schedAt('tarde',15,0,()=>{
    const dow=DOW_KEYS[new Date().getDay()];
    const pending=currentWeekTasks().filter(t=>t.day===dow&&!t.done);
    if(pending.length>0)_notify('tarde','FUVEST OS — Tarde',_pickMsg(NOTIF_MSGS_TARDE,pending.length));
  });

  // 3. Fechamento do dia (21:30) — resumo do que foi feito
  _schedAt('noite',21,30,()=>{
    const dow=DOW_KEYS[new Date().getDay()];
    const all=currentWeekTasks().filter(t=>t.day===dow);
    const done=all.filter(t=>t.done).length;
    _notify('noite','FUVEST OS — Dia encerrado',_pickMsg(NOTIF_MSGS_NOITE,done,all.length),{require:false});
  });

  // 4. Alerta de streak (22:00) — só se nenhuma tarefa foi concluída hoje
  _schedAt('streak',22,0,()=>{
    const dow=DOW_KEYS[new Date().getDay()];
    const done=currentWeekTasks().filter(t=>t.day===dow&&t.done).length;
    const streak=state.streak||0;
    if(done===0&&streak>0)_notify('streak','FUVEST OS ⚠️',_pickMsg(NOTIF_MSGS_STREAK,streak),{require:true});
  });

  // 5. Abertura de semana (segunda-feira 08:00)
  _schedAt('semana',8,0,()=>{
    if(new Date().getDay()!==1)return; // só segunda
    const wkTasks=currentWeekTasks();
    _notify('semana',`FUVEST OS — ${weekLabel(state.week)}`,`${wkTasks.length} tarefa${wkTasks.length!==1?'s':''} nesta semana. Começa forte, Heitor.`);
  });
}

function exportToICS(){
  const wdates=weekDatesMap();
  const pad=n=>String(n).padStart(2,'0');
  const fmt=dt=>`${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FUVEST OS//v10//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  DAY_ORDER.forEach(day=>{
    const dt=wdates[day];if(!dt)return;
    const ds=fmt(dt);const nd=new Date(dt);nd.setDate(dt.getDate()+1);const ds2=fmt(nd);
    dayTasks(day,state.week).forEach(t=>{
      const subj=SUBJECTS[t.subj]||{name:t.subj};
      lines.push('BEGIN:VEVENT',
        `DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${ds2}`,
        `SUMMARY:[${subj.name}] ${t.title||''}`,
        `DESCRIPTION:${t.type||''}${t.done?' ✓':''}`,
        `STATUS:${t.done?'COMPLETED':'NEEDS-ACTION'}`,
        `UID:fuvest-w${state.week}-${t.id||Math.random().toString(36).slice(2)}@fuvest-os`,
        'END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`fuvest-semana${state.week}.ics`;a.click();
  URL.revokeObjectURL(url);
  toast('Arquivo .ics baixado — importe no Google Calendar.');
}

const TOTAL_WEEKS=WEEK_META.length;
function uid(){return 't_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function subject(id){return SUBJECTS[id]||SUBJECTS.rot}

function categorizePor(t){
  if(t.subj!=='por')return t.subj;
  const low=(t.title||'').toLowerCase();
  const hasLit=low.includes('literatura')||/\baula[s]?\s+\d/i.test(low)||
    ['romantismo','barroco','arcadismo','realismo','naturalismo','parnasianismo',
     'simbolismo','quinhentismo','modernismo','pré-modern','fernando pessoa',
     'concretismo','contemporân'].some(k=>low.includes(k));
  const hasGram=low.includes('gramática')||low.includes('gramatica');
  const hasItp=low.includes('interpretação')||low.includes('interpretacao');
  const mix=[hasLit,hasGram,hasItp].filter(Boolean).length;
  if(mix>1)return 'por';
  if(hasGram)return 'gram';
  if(hasItp)return 'itp';
  if(hasLit)return 'lit';
  return 'por';
}

function extractCode(title){
  const t=title||'';
  const named=t.match(/\b([A-Z]\d{2}(?:-[A-Z]?\d{2})?)\b/g);
  if(named&&named.length)return named.slice(0,4).join(' · ');
  const bloco=t.match(/[Bb]locos?\s+(\d{2}(?:[,–\-]\d{2})*)/);
  if(bloco)return 'Bl.'+bloco[1].replace(/\s/g,'');
  const aula=t.match(/[Aa]ulas?\s+(\d+(?:[,–\-]\d+)?)/);
  if(aula)return 'Au.'+aula[1].replace(/\s/g,'');
  return '';
}

const FB_CONFIG_KEY='fuvest_fb_config';
let _fbDb=null,_fbSyncing=false,_fbError=null,_fbSkipRemote=false;
function save(){
  state.lastSaved=Date.now();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(_fbDb&&state.syncKey){
    _fbSkipRemote=true;
    _fbDb.ref('fuvest/'+state.syncKey+'/state').set(state).catch(err=>{_fbError=String(err.message||err);_fbSyncing=false;});
  }
}
function loadFirebaseSDK(cb){
  if(window.firebase&&window.firebase.database){cb();return;}
  const s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload=()=>{
    const s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
    s2.onload=cb;
    s2.onerror=()=>{_fbError='Falha ao carregar Firebase SDK';renderSettings();};
    document.head.appendChild(s2);
  };
  s1.onerror=()=>{_fbError='Falha ao carregar Firebase SDK';renderSettings();};
  document.head.appendChild(s1);
}
function initFirebase(){
  const raw=localStorage.getItem(FB_CONFIG_KEY);if(!raw)return;
  let cfg;try{cfg=JSON.parse(raw);}catch(e){_fbError='Config inválida';return;}
  if(!state.syncKey){state.syncKey=uid();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  loadFirebaseSDK(()=>{
    try{
      if(window.firebase.apps&&firebase.apps.length)firebase.apps.forEach(a=>a.delete&&a.delete());
      firebase.initializeApp(cfg);
      _fbDb=firebase.database();
      _fbSyncing=true;_fbError=null;
      const ref=_fbDb.ref('fuvest/'+state.syncKey+'/state');
      ref.on('value',snap=>{
        if(_fbSkipRemote){_fbSkipRemote=false;return;}
        const remote=snap.val();
        if(!remote)return;
        if(remote.lastSaved&&(!state.lastSaved||remote.lastSaved>state.lastSaved)){
          const keepTheme=state.theme,keepKey=state.syncKey,keepSeed=state.seedVersion;
          Object.assign(state,remote);
          state.theme=keepTheme;state.syncKey=keepKey;state.seedVersion=keepSeed;
          syncWeekFromDate();
          document.documentElement.dataset.theme=state.theme;
          localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
          renderActive();
        }
      });
      renderSettings();
    }catch(e){_fbError=String(e.message||e);_fbSyncing=false;renderSettings();}
  });
}

function fireConfetti(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  const cols=['#f03b40','#ff9500','#34c759','#007aff','#af52de','#ff2d55','#ffcc00','#00cfff','#ff6b35','#a8ff3e'];
  const W=canvas.width,H=canvas.height;
  // Three burst origins along the bottom
  const origins=[[W*.3,H*.88],[W*.5,H*.92],[W*.7,H*.88]];
  const pieces=Array.from({length:110},(_,i)=>{
    const [ox,oy]=origins[i%origins.length];
    const angle=-Math.PI/2+(Math.random()-.5)*Math.PI*.85;
    const sp=9+Math.random()*13;
    return{
      x:ox+(Math.random()-.5)*40,y:oy,
      vx:Math.cos(angle)*sp,vy:Math.sin(angle)*sp,
      w:5+Math.random()*7,h:3+Math.random()*5,
      rot:Math.random()*360,vr:(Math.random()-.5)*14,
      color:cols[i%cols.length],alpha:1,
      shape:Math.random()<.22?'circle':'rect'
    };
  });
  let t=0;
  const tick=()=>{
    ctx.clearRect(0,0,W,H);
    let live=false;
    for(const p of pieces){
      p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vx*=.992;
      if(t>52)p.alpha=Math.max(0,p.alpha-.024);
      if(p.alpha<=0||p.y>H+40)continue;
      live=true;
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.fillStyle=p.color;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill();}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    t++;
    if(live)requestAnimationFrame(tick);else canvas.remove();
  };
  requestAnimationFrame(tick);
}

const drag={active:false,id:null,ghost:null,sourceEl:null,offsetX:0,offsetY:0,insertBeforeId:null,lastX:0,lastY:0,startX:0,startY:0};
let _lastDragEndTime=0;
function taskPointerDown(e,id){
  if(e.target.closest('.task-tools,.check,.tiny,.card-part'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.currentTarget;
  drag.id=id;drag.sourceEl=el;drag.active=false;
  drag.offsetX=e.clientX-el.getBoundingClientRect().left;
  drag.offsetY=e.clientY-el.getBoundingClientRect().top;
  drag.startX=e.clientX;drag.startY=e.clientY;
  drag.lastX=e.clientX;drag.lastY=e.clientY;
  el.style.touchAction='none';
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove',_onDragMove,{passive:false});
  el.addEventListener('pointerup',_onDragEnd);
  el.addEventListener('pointercancel',_onDragCancel);
}
function _onDragMove(e){
  if(!drag.id)return;
  e.preventDefault();
  drag.lastX=e.clientX;drag.lastY=e.clientY;
  if(!drag.active){
    const sdx=e.clientX-drag.startX,sdy=e.clientY-drag.startY;
    // Swipe right → complete, before ghost appears
    if(sdx>52&&Math.abs(sdy)<28){
      const id=drag.id,el=drag.sourceEl;
      el.style.touchAction='';
      el.removeEventListener('pointermove',_onDragMove);
      el.removeEventListener('pointerup',_onDragEnd);
      el.removeEventListener('pointercancel',_onDragCancel);
      drag.id=null;drag.sourceEl=null;
      el.classList.add('swipe-complete');
      setTimeout(()=>el.classList.remove('swipe-complete'),320);
      _lastDragEndTime=Date.now();
      toggleTask(id,true);return;
    }
    if(Math.abs(sdx)<5&&Math.abs(sdy)<5)return;
    drag.active=true;
    const el=drag.sourceEl;
    el.classList.add('drag-source');
    const ghost=el.cloneNode(true);
    ghost.className='drag-ghost '+el.className;
    ghost.style.width=el.offsetWidth+'px';
    document.body.appendChild(ghost);drag.ghost=ghost;
  }
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-drag.offsetX)+'px';
    drag.ghost.style.top=(e.clientY-drag.offsetY)+'px';
  }
  // Determine target col (ghost must be pointer-events:none in CSS)
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const col=under?.closest('.agenda-col');
  document.querySelectorAll('.agenda-col').forEach(c=>c.classList.remove('over'));
  document.querySelectorAll('.insert-line').forEach(l=>l.remove());
  if(!col)return;
  col.classList.add('over');
  const list=col.querySelector('.task-list');if(!list)return;
  const items=[...list.querySelectorAll('.agenda-task,.compact-card')].filter(x=>x.dataset.taskId!==drag.id);
  let insertBefore=null;
  for(const item of items){const r=item.getBoundingClientRect();if(e.clientY<r.top+r.height/2){insertBefore=item;break;}}
  drag.insertBeforeId=insertBefore?insertBefore.dataset.taskId:null;
  const line=document.createElement('div');line.className='insert-line';
  if(insertBefore)list.insertBefore(line,insertBefore);else list.appendChild(line);
}
function _onDragEnd(e){
  // snapshot drag state before cleanup resets it
  const wasActive=drag.active,taskId=drag.id,insertBefore=drag.insertBeforeId;
  const lx=drag.lastX,ly=drag.lastY;
  _cleanupDrag();_resetDrag();
  if(!wasActive||!taskId)return;
  const under=document.elementFromPoint(lx,ly);
  const col=under?.closest('.agenda-col');
  const day=col?.dataset.day;
  const t=state.tasks.find(x=>x.id===taskId);
  if(!t||!day)return;
  const oldDay=t.day;t.day=day;t.week=Number(state.week);
  if(insertBefore){
    const fromIdx=state.tasks.findIndex(x=>x.id===taskId);
    const toIdx=state.tasks.findIndex(x=>x.id===insertBefore);
    if(fromIdx>=0&&toIdx>=0&&fromIdx!==toIdx){
      const [moved]=state.tasks.splice(fromIdx,1);
      state.tasks.splice(state.tasks.findIndex(x=>x.id===insertBefore),0,moved);
    }
  }
  _lastDragEndTime=Date.now();
  save();renderActive();
  toast(oldDay===day?'Tarefa reordenada.':`Tarefa movida para ${DAYS[day].name}.`);
}
function _onDragCancel(){_cleanupDrag();_resetDrag();}
function _cleanupDrag(){
  if(drag.sourceEl){

    drag.sourceEl.removeEventListener('pointercancel',_onDragCancel);

    p.style.cssText=`left:${cx}px;top:${cy}px;width:${size};height:${size};background:${colors[i%colors.length]};--px:${px};--py:${py};animation-delay:${(i*30).toFixed(0)}ms`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }

function initAnimObserver(){

    entries.forEach(e=>{
      if(e.isIntersecting){
        const bars=e.target.querySelectorAll('.raio-x-bar-fill');
        bars.forEach((b,i)=>setTimeout(()=>b.classList.add('anim-in'),120+i*80));
        obs.unobserve(e.target);

    });
  },{threshold:0.15});
  document.querySelectorAll('.subject-card').forEach(c=>obs.observe(c));
}
