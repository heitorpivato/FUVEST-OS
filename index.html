// ===== 5. Magnetic Buttons =====
(function initMagnetic(){
  const SEL='.btn.primary,.btn:not(.ghost):not(.icon),.ex-btn';
  const R=65,ST=0.32;
  let mx=0,my=0,raf=null;
  function update(){
    document.querySelectorAll(SEL).forEach(el=>{
      const r=el.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=mx-cx,dy=my-cy;
      const dist=Math.hypot(dx,dy);
      if(dist<R){
        const f=(1-dist/R)*ST;
        el.style.transition='transform 80ms linear';
        el.style.transform=`translate(${(dx*f).toFixed(2)}px,${(dy*f).toFixed(2)}px)`;
        el.dataset.mag='1';
      } else if(el.dataset.mag==='1'){
        el.dataset.mag='0';
        el.style.transition='transform 420ms cubic-bezier(.34,1.56,.64,1)';
        el.style.transform='';
      }
    });
    raf=null;
  }
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(update);});
  document.addEventListener('mouseleave',()=>{document.querySelectorAll(`${SEL}[data-mag="1"]`).forEach(el=>{el.dataset.mag='0';el.style.transition='transform 420ms cubic-bezier(.34,1.56,.64,1)';el.style.transform='';});});
})();

// ===== 6. Command Palette =====
let _cmdOpen=false,_cmdSel=0,_cmdItems=[];
function openCmd(){
  const bd=document.getElementById('cmd-backdrop');if(!bd)return;
  bd.classList.add('open');_cmdOpen=true;_cmdSel=0;
  const inp=document.getElementById('cmd-input');
  if(inp){inp.value='';setTimeout(()=>inp.focus(),60);}
  _renderCmd('');
}
function closeCmd(){
  const bd=document.getElementById('cmd-backdrop');if(bd)bd.classList.remove('open');
  _cmdOpen=false;
}
function _cmdActions(){
  return[
    {icon:'🏠',title:'Início',sub:'Ver tela principal',fn:()=>{switchView('home');closeCmd();}},
    {icon:'📅',title:'Agenda',sub:'Semana atual',fn:()=>{switchView('agenda');closeCmd();}},
    {icon:'📚',title:'Matérias',sub:'Progresso por disciplina',fn:()=>{switchView('subjects');closeCmd();}},
    {icon:'⚙️',title:'Ajustes',sub:'Configurações e temas',fn:()=>{switchView('settings');closeCmd();}},
    {icon:'➕',title:'Nova tarefa',sub:'Criar nova tarefa',fn:()=>{closeCmd();setTimeout(openTask,120);}},
  ];
}
function _renderCmd(q){
  const cont=document.getElementById('cmd-results');if(!cont)return;
  const ql=q.toLowerCase().trim();
  const actions=_cmdActions().filter(a=>!ql||a.title.toLowerCase().includes(ql)||a.sub.toLowerCase().includes(ql));
  const tasks=(state.tasks||[]).filter(t=>!ql||(t.title||'').toLowerCase().includes(ql)||(SUBJECTS[t.subj]?.name||'').toLowerCase().includes(ql)).slice(0,10);
  _cmdItems=[];
  let html='';
  if(actions.length){
    html+=`<div class="cmd-sec">Ações</div>`;
    actions.forEach(a=>{_cmdItems.push(a);html+=`<div class="cmd-item${_cmdItems.length-1===_cmdSel?' cmd-sel':''}" data-idx="${_cmdItems.length-1}"><div class="cmd-ico">${a.icon}</div><div class="cmd-txt"><div class="cmd-title">${esc(a.title)}</div><div class="cmd-sub">${esc(a.sub)}</div></div></div>`;});
  }
  if(tasks.length){
    html+=`<div class="cmd-sec">Tarefas</div>`;
    tasks.forEach(t=>{
      const s=SUBJECTS[t.subj]||{};
      const fn=()=>{switchView('agenda');state.week=t.week;state.day=t.day;save();renderActive();closeCmd();};
      _cmdItems.push({fn});
      html+=`<div class="cmd-item${_cmdItems.length-1===_cmdSel?' cmd-sel':''}" data-idx="${_cmdItems.length-1}"><div class="cmd-ico" style="background:${s.color||'var(--accent)'};font-size:11px;font-weight:800;color:#fff">${(s.name||'?')[0]}</div><div class="cmd-txt"><div class="cmd-title">${esc(t.title||'')}</div><div class="cmd-sub">${esc(s.name||'')} · Sem ${t.week}${t.day?' · '+(DAYS[t.day]?.name||t.day):''}</div></div></div>`;
    });
  }
  if(!html)html=`<div class="cmd-empty">Nenhum resultado para "${esc(q)}"</div>`;
  cont.innerHTML=html;
  cont.querySelectorAll('.cmd-item').forEach(el=>{
    el.addEventListener('click',()=>{const i=parseInt(el.dataset.idx);if(_cmdItems[i])_cmdItems[i].fn?.();});
    el.addEventListener('mouseenter',()=>{_cmdSel=parseInt(el.dataset.idx);_highlightCmd();});
  });
}
function _highlightCmd(){
  document.querySelectorAll('#cmd-results .cmd-item').forEach((el,i)=>el.classList.toggle('cmd-sel',i===_cmdSel));
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();_cmdOpen?closeCmd():openCmd();return;}
  if(!_cmdOpen)return;
  if(e.key==='Escape'){closeCmd();return;}
  if(e.key==='ArrowDown'){e.preventDefault();_cmdSel=Math.min(_cmdSel+1,_cmdItems.length-1);_highlightCmd();}
  else if(e.key==='ArrowUp'){e.preventDefault();_cmdSel=Math.max(_cmdSel-1,0);_highlightCmd();}
  else if(e.key==='Enter'){e.preventDefault();if(_cmdItems[_cmdSel])_cmdItems[_cmdSel].fn?.();}
});
document.getElementById('cmd-input')?.addEventListener('input',e=>_renderCmd(e.target.value));
document.getElementById('cmd-backdrop')?.addEventListener('click',e=>{if(e.target.id==='cmd-backdrop')closeCmd();});

// ===== Mouse FX =====
(function initMouseFX(){
  const spot=document.createElement('div');
  spot.className='spotlight';
  document.body.appendChild(spot);
  let _raf=null,_mx=0,_my=0;
  let _tilt=null,_tiltTarget=null;
  const TILT_ALLOW=['subject-card'];
  function isTiltable(card){
    if(!card)return false;
    if(card.closest('.modal'))return false;
    return TILT_ALLOW.some(c=>card.classList.contains(c));
  }
  function resetTilt(c){
    if(!c)return;
    c.style.transition='transform 400ms cubic-bezier(0.34,1.2,0.64,1),box-shadow 300ms';
    c.style.transform='';c.style.boxShadow='';
  }
  function tick(){
    // GPU-composited: no layout, no paint — straight to compositor
    spot.style.transform=`translate(${_mx-480}px,${_my-480}px)`;
    if(_tiltTarget){
      const r=_tiltTarget.getBoundingClientRect();
      const dx=(_mx-(r.left+r.width/2))/(r.width/2);
      const dy=(_my-(r.top+r.height/2))/(r.height/2);
      _tiltTarget.style.transform=`perspective(800px) rotateY(${(dx*10).toFixed(2)}deg) rotateX(${(-dy*8).toFixed(2)}deg) translateY(-4px) scale(1.02)`;
      _tiltTarget.style.boxShadow='var(--shadow-lg),0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)';
    }
    _raf=null;
  }
  document.addEventListener('mousemove',e=>{
    _mx=e.clientX;_my=e.clientY;
    const card=e.target.closest?.('.card');
    const safe=isTiltable(card)?card:null;
    if(_tilt&&_tilt!==safe){resetTilt(_tilt);_tilt=null;_tiltTarget=null;}
    if(safe){
      if(_tilt!==safe){safe.style.transition='transform 80ms linear,box-shadow 180ms';_tilt=safe;}
      _tiltTarget=safe;
    }
    if(!_raf)_raf=requestAnimationFrame(tick);
  });
  document.addEventListener('mouseleave',()=>{
    spot.style.transform='translate(-9999px,-9999px)';
    resetTilt(_tilt);_tilt=null;_tiltTarget=null;
    if(_raf){cancelAnimationFrame(_raf);_raf=null;}
  });
})();

// ===== Swipe to navigate (mobile) =====
(function initSwipe(){
  const VIEWS=['home','agenda','subjects','settings'];
  const BLOCK_SEL='.agenda-board,.filter-bar,.day-chips,.modal-backdrop,[data-swipe-block]';
  let sx=0,sy=0,swiped=false;
  document.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiped=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);
    if(!swiped&&dx>dy&&dx>10)swiped=true;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!swiped)return;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<Math.abs(dy)*1.3||Math.abs(dx)<52)return;
    if(e.target.closest(BLOCK_SEL))return;
    const cur=VIEWS.indexOf(activeView);
    if(dx<-52&&cur<VIEWS.length-1)switchView(VIEWS[cur+1]);
    else if(dx>52&&cur>0)switchView(VIEWS[cur-1]);
  },{passive:true});
})();

// Animated Stepper
function buildStepper(){
  const wdays=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
  const blocks=[];
  for(let w=1;w<=5;w++){
    for(const day of wdays){
      const ts=state.tasks.filter(t=>t.week===w&&t.day===day);
      if(ts.length)blocks.push({w,day,ts,n:blocks.length+1});
    }
  }
  if(!blocks.length)return '';
  const curIdx=blocks.findIndex(b=>b.w===Number(state.week)&&b.day===state.day);
  const doneB=blocks.filter(b=>b.ts.every(t=>t.done)).length;
  let html='<div class="stepper-wrap"><div class="stepper-title">Cronograma · '+doneB+'/'+blocks.length+' dias concluídos</div><div class="stepper-scroll">';
  blocks.forEach((b,i)=>{
    const isDone=b.ts.every(t=>t.done);
    const isCur=i===curIdx;
    const s=subject(b.ts[0].subj);
    const color=s.color;
    const cls=isDone?'s-done':isCur?'s-current':'';
    const bg=isDone?'background:'+color+';border-color:'+color+';--s-color:'+color:'';
    const lbl=b.ts.map(t=>t.title.split(' ')[0]).join('·').slice(0,14);
    if(i>0){
      const prevDone=blocks[i-1].ts.every(t=>t.done);
      html+='<div class="step-connector'+(prevDone?' done-conn':'')+'"></div>';
    }
    html+='<div class="step-node" onclick="state.week='+b.w+';state.day=\''+b.day+'\';save();renderActive();switchView(\'home\')">';
    html+='<div class="step-circle '+cls+'" style="'+bg+'">'+b.n+'</div>';
    html+='<div class="step-label">'+lbl+'</div></div>';
  });
  html+='</div></div>';
  return html;
}
function injectStepper(){
  const view=document.getElementById('view-home');
  if(!view||view.style.display==='none')return;
  let sec=view.querySelector('.stepper-section-el');
  if(!sec){
    sec=document.createElement('div');
    sec.className='card stepper-section-el';
    sec.style.marginBottom='14px';
    const sh=view.querySelector('.section-head');
    if(sh)sh.parentNode.insertBefore(sec,sh);
  }
  if(state.tasks.length)sec.innerHTML=buildStepper();
}

    else if(action==='edit')editTask(tid);
    else if(action==='del')deleteTask(tid);
    else if(action==='anki'){const t=state.tasks.find(x=>x.id===tid);if(t){t.ankiDone=!t.ankiDone;save();renderActive();}}
    else if(action==='quest'){const t=state.tasks.find(x=>x.id===tid);if(t){const v=prompt('Questões resolvidas:',t.exDone||0);if(v!==null){t.exDone=Math.max(0,parseInt(v)||0);save();}}}
    window._closeBubble();
  };
  window._closeBubble=function(){
    menu.classList.remove('show');
    document.querySelector('.bubble-backdrop')?.remove();
    tid=null;
  };
  document.addEventListener('pointerdown',e=>{
    const task=e.target.closest('.home-task,.agenda-task');
    if(!task)return;
    const id=task.dataset.taskId;if(!id)return;
    ltimer=setTimeout(()=>{
      navigator.vibrate&&navigator.vibrate(25);
      tid=id;
      menu.style.left=e.clientX+'px';
      menu.style.top=e.clientY+'px';
      menu.classList.add('show');
      const bd=document.createElement('div');
      bd.className='bubble-backdrop';
      bd.onclick=window._closeBubble;
      document.body.insertBefore(bd,menu);
    },520);
  },{passive:true});
  document.addEventListener('pointerup',()=>clearTimeout(ltimer),{passive:true});
  document.addEventListener('pointermove',()=>clearTimeout(ltimer),{passive:true});
})();

// Patch renderActive to re-init after each render
(function(){
  const _ra=window.renderActive;
  if(typeof _ra!=='function')return;
  window.renderActive=function(){
    _ra.apply(this,arguments);
    setTimeout(()=>{initPillNav();initTiltCards();initMagDock();injectStepper();},60);
  };
})();

// Bootstrap on load
setTimeout(()=>{
  initNavStagger();
  initPillNav();
  initTiltCards();
  initMagDock();
  injectStepper();
},150);

</script>
